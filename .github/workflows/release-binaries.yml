name: Release binaries

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag/version to build
        required: true
        default: v2.3.1
        type: string
      source_ref:
        description: Optional full commit SHA (defaults to the release tag)
        required: false
        default: ''
        type: string
      platform:
        description: Platform to build (or all)
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-arm64
          - linux-x86_64
          - macos-arm64
          - macos-x86_64

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  platforms:
    name: Select build platforms
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          platforms = [
              {"platform": "linux-arm64", "runner": "ubuntu-22.04-arm", "target": "aarch64-unknown-linux-gnu"},
              {"platform": "linux-x86_64", "runner": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"},
              {"platform": "macos-arm64", "runner": "macos-14", "target": "aarch64-apple-darwin"},
              {"platform": "macos-x86_64", "runner": "macos-15-intel", "target": "x86_64-apple-darwin"},
          ]
          selected = os.environ["SELECTED_PLATFORM"]
          matrix = [p for p in platforms if selected == "all" or p["platform"] == selected]
          if not matrix:
              raise SystemExit("Unknown build platform")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": matrix}) + "\n")
          PY
  build:
    name: Build ${{ matrix.platform }}
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ inputs.source_ref }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -z "$SOURCE_REF" || "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$BUILD_TARGET"
          rustc -vV
      - name: Build and test release source
        shell: bash
        run: |
          cargo generate-lockfile
          cargo test --locked -p mycli -p cersei-provider -p cersei-agent -p cersei-memory -p cersei-tools --target "$BUILD_TARGET"
          cargo build --locked --release -p mycli --target "$BUILD_TARGET"
      - name: Strip, verify, and package
        shell: bash
        run: |
          package="mycli-${RELEASE_TAG#v}-$BUILD_PLATFORM"
          mkdir -p "dist/$package"
          cp "target/$BUILD_TARGET/release/mycli" "dist/$package/mycli"
          if [[ "$RUNNER_OS" == macOS ]]; then
            strip -x "dist/$package/mycli"
            codesign --force --sign - "dist/$package/mycli"
            codesign --verify "dist/$package/mycli"
            otool -L "dist/$package/mycli"
          else
            strip --strip-unneeded "dist/$package/mycli"
            ldd "dist/$package/mycli"
          fi
          file "dist/$package/mycli"
          test "$("dist/$package/mycli" --version)" = "mycli ${RELEASE_TAG#v}"
          cp README.md config.example.toml system-prompts.toml skills-internal.toml Cargo.lock "dist/$package/"
          cp -R bench "dist/$package/bench"
          cp -R docs "dist/$package/docs"
          test -x "dist/$package/bench/bench.py"
          python3 "dist/$package/bench/bench.py" --help >/dev/null
          {
            printf 'Tag: %s\nCommit: %s\nTarget: %s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" "$BUILD_TARGET"
            rustc -vV
            if [[ "$RUNNER_OS" == macOS ]]; then
              printf 'Minimum macOS version: %s\nSigning: ad-hoc, not notarized\n' "$MACOSX_DEPLOYMENT_TARGET"
            else
              ldd --version | head -n 1
            fi
          } > "dist/$package/BUILD-INFO.txt"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mycli-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release downloads
    needs: build
    if: ${{ !inputs.source_ref && (github.event_name == 'push' || inputs.platform == 'all') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mycli-*
          path: dist
          merge-multiple: true
      - name: Verify archives and generate checksums
        working-directory: dist
        run: |
          for platform in linux-arm64 linux-x86_64 macos-arm64 macos-x86_64; do
            test -s "mycli-${RELEASE_TAG#v}-$platform.tar.gz"
          done
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes="docs/releases/${RELEASE_TAG#v}.md"
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "MyCLI ${RELEASE_TAG#v}" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "MyCLI ${RELEASE_TAG#v}" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
