name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.1.0
        type: string
      platform:
        description: Platform to build (or all)
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-arm64
          - linux-x86_64
          - macos-arm64
          - macos-x86_64

permissions:
  contents: read

jobs:
  platforms:
    name: Select build platforms
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json
          import os

          platforms = [
              {"platform": "linux-arm64", "runner": "ubuntu-22.04-arm", "target": "aarch64-unknown-linux-gnu"},
              {"platform": "linux-x86_64", "runner": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"},
              {"platform": "macos-arm64", "runner": "macos-14", "target": "aarch64-apple-darwin"},
              {"platform": "macos-x86_64", "runner": "macos-15-intel", "target": "x86_64-apple-darwin"},
          ]
          selected = os.environ["SELECTED_PLATFORM"]
          matrix = [p for p in platforms if selected == "all" or p["platform"] == selected]
          if not matrix:
              raise SystemExit("Unknown build platform")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": matrix}) + "\n")
          PY
  build:
    name: Build ${{ matrix.platform }}
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$BUILD_TARGET"
          rustc -vV
      - name: Build and test tagged source
        shell: bash
        run: |
          cargo generate-lockfile
          cargo test --locked -p mycli -p cersei-provider --target "$BUILD_TARGET"
          cargo build --locked --release -p mycli --target "$BUILD_TARGET"
      - name: Strip, verify, and package
        shell: bash
        run: |
          package="mycli-${RELEASE_TAG#v}-$BUILD_PLATFORM"
          mkdir -p "dist/$package"
          cp "target/$BUILD_TARGET/release/mycli" "dist/$package/mycli"
          if [[ "$RUNNER_OS" == macOS ]]; then
            strip -x "dist/$package/mycli"
            codesign --force --sign - "dist/$package/mycli"
            codesign --verify "dist/$package/mycli"
            otool -L "dist/$package/mycli"
          else
            strip --strip-unneeded "dist/$package/mycli"
            ldd "dist/$package/mycli"
          fi
          file "dist/$package/mycli"
          test "$("dist/$package/mycli" --version)" = "mycli ${RELEASE_TAG#v}"
          cp README.md config.example.toml Cargo.lock "dist/$package/"
          {
            printf 'Tag: %s\nCommit: %s\nTarget: %s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" "$BUILD_TARGET"
            rustc -vV
            if [[ "$RUNNER_OS" == macOS ]]; then
              printf 'Minimum macOS version: %s\nSigning: ad-hoc, not notarized\n' "$MACOSX_DEPLOYMENT_TARGET"
            else
              ldd --version | head -n 1
            fi
          } > "dist/$package/BUILD-INFO.txt"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mycli-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
