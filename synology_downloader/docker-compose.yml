services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-trixie-slim
    container_name: hf-model-downloader
    volumes:
      - /volume1/backup/LLM/models:/models
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      LIST_FILE: /models/to-download-new.txt
    command: ["bash", "/models/download_models.sh"]
    restart: "no"
