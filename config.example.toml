# ─── Local (oMLX) ──────────────────────────────────────────
# API key for your oMLX server (http://127.0.0.1:8000)
api_key = "omlx-xxxxxxxxxxxxxxxxxxxx"

# Uncomment to override defaults:
# base_url = "http://127.0.0.1:8000/v1"
# model = ""              # empty = auto-detect first loaded model
# max_turns = 30
# max_tokens = 16384
# tool_tier = "auto"      # auto | simple | medium | full
# persona = "code"        # code | redteam | blueteam | data
# cost_limit = 0.0        # USD per session, 0 = unlimited
# context_window = 0      # tokens; 0 = ask the server, else guess from the model name
# show_thinking = true    # stream model reasoning; Ctrl+O toggles at runtime
# temperature = 0.6       # omitted = server default
# top_p = 0.95            # optional nucleus sampling cutoff, 0..1
# min_p = 0.05            # optional minimum relative probability, 0..1

# ─── Named local model profiles ────────────────────────────
# Usage: mycli --local ds4think  OR  /local [name] in the REPL.
# /local lists these profiles; /model lists the default server's models.
# Settings are reloaded from disk each time you use /local.
# Existing [cloud.ds4*] profiles can be moved here by renaming their tables.
# A project profile replaces the global profile with the same name.
#
# base_url: omitted = top-level local endpoint. Use a LAN URL or SSH tunnel.
# api_key: omitted = top-level key only when using that same endpoint;
#          use "" for a server that needs no authentication.
# model: omitted/empty = detect the first model from this server's /models.
# max_tokens/max_turns/temperature/top_p/min_p/thinking/tool_tier/persona/show_thinking inherit
# top-level defaults when omitted. context_window defaults to auto-detection;
# reasoning_effort defaults to the server's choice, not the previous profile.
# web_search defaults to false: enable only for oMLX's search extension.

# [local.glm]
# model = "glm-5.2"
# max_tokens = 16384
# temperature = 0.6       # 0..2, subject to the server's supported range
# tool_tier = "medium"   # auto | simple | medium | full
# web_search = true      # this profile uses oMLX

# [local.ds4think]
# base_url = "http://127.0.0.1:8000/v1"
# api_key = ""
# model = "deepseek-reasoner"
# max_tokens = 8192
# max_turns = 30
# context_window = 32768 # 0 = ask server, then fall back to model-name estimate
# reasoning_effort = "max" # supported levels depend on model; default resets
# temperature = 0.6
# tool_tier = "full"
# persona = "code"
# show_thinking = true
# web_search = false

# [local.glmfast]
# base_url = "http://127.0.0.1:8000/v1"
# api_key = ""
# model = "glm-5.3-flash-nothink"
# temperature = 1.0
# top_p = 0.95
# min_p = 0.05
# thinking = false       # model-level control; DS4 accepts this template flag
# max_tokens = 2048      # response cap, separate from server context size
# show_thinking = false  # display preference
# These sampling controls require server support. DS4's chat-completions
# endpoint accepts them. --mtp and --ctx remain DS4 startup options;
# mycli's context_window describes capacity, it does not resize the server.

# ─── MCP servers ───────────────────────────────────────────
# Tools auto-discovered on startup (full tier only)
# Codex-compatible named tables; copy command-based servers from Codex config.

# [mcp_servers.command-vault]
# command = "/path/to/command-vault/.venv/bin/python"
# args = ["-m", "command_vault.server"]
# env = { VAULT_DB = "/path/to/vault.db", VAULT_READONLY = "1" }
# enabled = true
# cwd = "/path/to/project"

# [mcp_servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env = { GITHUB_TOKEN = "ghp_xxxxxxxxxxxx" }

# ─── Cloud models ──────────────────────────────────────────
# Usage: mycli --cloud kimi  OR  /cloud kimi  in REPL
# Built-in presets provide base_url automatically.
# You can also define custom profiles with any base_url.

[cloud.kimi]
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
model = "kimi-k3"
# reasoning_effort = "max" # default | low | high | max
# context_window = 262144   # set when the model id is not in the built-in table;
                            # NOT max_tokens, which caps a single response

[cloud.deepseek]
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
model = "deepseek-chat"
# reasoning_effort = "high" # default | none | low | high | max
# No separate -think profile needed; /reasoning selects the mode and effort.

[cloud.gemini]
api_key = "AIzaXxXxXxXxXxXxXxXxXxXxXxXxXxXxXxXxXxX"
model = "gemini-3.1-pro-preview"
# reasoning_effort = "medium" # default | low | medium | high

[cloud.openai]
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
model = "gpt-5.4"
# reasoning_effort = "high" # default | none | low | medium | high | xhigh
# GPT-5.6 models also support max. /cloud and /reasoning offer supported levels.
# Optional, for `/usage` only. OpenAI has no credit-balance endpoint at all —
# not even for admin keys — so /usage reports spend via the Costs API, which
# needs an admin key (sk-admin-...) with the api.usage.read scope. Or set
# OPENAI_ADMIN_KEY in the environment.
# admin_key = "sk-admin-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# Record a top-up to get a remaining-credit figure instead of raw spend:
# /usage then shows `credits - spend since credits_since`.
# credits = 50.00
# credits_since = "2026-08-01"

# Streamable HTTP MCP (use your server's actual endpoint):
# [mcp_servers.ida-pro]
# url = "http://127.0.0.1:13337/mcp"
# bearer_token_env_var = "IDA_MCP_TOKEN"
# http_headers = { "X-Client" = "mycli" }
# env_http_headers = { "X-API-Key" = "IDA_API_KEY" }
